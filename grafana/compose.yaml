services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${GRAFANA_DB_NAME}
      - POSTGRES_USER=${GRAFANA_DB_USER}
      - POSTGRES_PASSWORD=${GRAFANA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-public
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      # Credenciais
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      # Persistência no Postgres
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: ${GRAFANA_DB_HOST}
      GF_DATABASE_PORT: ${GRAFANA_DB_PORT}
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME}
      GF_DATABASE_USER: ${GRAFANA_DB_USER}
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proxy-public
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.local`)"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  grafana_data:
    driver: local
  postgres_data:
    driver: local

networks:
  proxy-public:
    external: true